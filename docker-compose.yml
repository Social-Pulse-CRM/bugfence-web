services:
  bugfence-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bugfence-web:latest
    container_name: bugfence-web
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      - NODE_ENV=production
    # Security hardening (unprivileged, read-only root filesystem)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Nginx unprivileged requires write access to /tmp for pid and buffers
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
